<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bandzl - Live Music Finder (v0.4.3)</title>
  
  <!-- Google Fonts: Fredoka & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>bandzl</h1>
    <p>Live Music Finder PWA</p>
  </header>

  <main>
    <!-- Interactive Map Section -->
    <section class="map-section">
      <div id="map"></div>
      <button id="riff-radar-btn" aria-label="Riff Radar">📡 RIFF RADAR</button>
    </section>

    <!-- Events Bottom Sheet / List -->
    <section class="events-section">
      <h2>Nearby Shows</h2>
      <div id="events-container" aria-live="polite">
        <p>Loading events...</p>
      </div>
    </section>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
